name: build

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile + alle JUnit-5-Tests
        run: ./gradlew --no-daemon build
      - name: Fat-Jar bauen
        run: ./gradlew --no-daemon :desktop:fatJar
      - uses: actions/upload-artifact@v4
        with:
          name: MailClient-jar
          path: desktop/build/libs/MailClient-0.1.0.jar

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MailClient-jar
      - uses: softprops/action-gh-release@v2
        with:
          files: MailClient-0.1.0.jar
          generate_release_notes: true
