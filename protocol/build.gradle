// Protocol module (M1): IMAP/POP3/SMTP via Jakarta Mail (Angus Mail implementation).
// java-library + api exposure: consumers (storage) see jakarta.mail types in signatures.
apply plugin: 'java-library'

dependencies {
    implementation project(':core')
    api 'jakarta.mail:jakarta.mail-api:2.1.3'
    implementation 'org.eclipse.angus:angus-mail:2.0.3'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // Embedded IMAP/POP3/SMTP server for integration tests (M1-004)
    testImplementation 'com.icegreen:greenmail-junit5:2.0.1'
}
