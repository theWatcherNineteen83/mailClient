// Desktop-Shell (M4): Swing, hängt nur an core + storage (Constitution: UI-freie Core-Module).
plugins {
    id 'application'
}

dependencies {
    implementation project(':core')
    implementation project(':storage')
    // Konto-Anlage-Dialog (M4-003): Verbindungstest gegen echte IMAP/POP3/SMTP-Server
    implementation project(':protocol')
    runtimeOnly 'org.xerial:sqlite-jdbc:3.46.1.3'

    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'de.metis.mail.desktop.MailDesktopApp'
}

// Ein-Klick-Jar für andere Rechner (z.B. Windows 11): alle Abhängigkeiten inkl. SQLite-Native.
tasks.register('fatJar', Jar) {
    group = 'distribution'
    archiveBaseName = 'MailClient'
    archiveVersion = '0.1.0'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    // Explizite Task-Abhängigkeit: runtimeClasspath enthält Projekt-Jars (core/storage/protocol),
    // sonst validiert Gradle bei `build fatJar` in einem Lauf eine implizite Abhängigkeit weg.
    dependsOn configurations.runtimeClasspath
    manifest { attributes 'Main-Class': 'de.metis.mail.desktop.MailDesktopApp' }
    from sourceSets.main.output
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    } {
        exclude 'META-INF/versions/**/module-info.class'
        exclude 'module-info.class'
    }
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA'
}
